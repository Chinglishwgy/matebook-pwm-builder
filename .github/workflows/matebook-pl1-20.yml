name: MateBook PL1 20W - VoltageShiftSecure experimental

on:
  push:
    paths:
      - 'voltage20/**'
      - '.github/workflows/matebook-pl1-20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout MateBook scripts
        uses: actions/checkout@v5

      - name: Checkout exact VoltageShiftSecure source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/xCuri0/VoltageShiftSecure.git vs
          git -C vs checkout --detach 6b4612c004a4631c4c3e4831f2a6989718dea6a5
          test "$(git -C vs rev-parse HEAD)" = "6b4612c004a4631c4c3e4831f2a6989718dea6a5"

      - name: Restrict Kext to fixed Tiger Lake PL1 access
        shell: bash
        run: |
          set -euo pipefail
          python3 voltage20/patch-msr-allowlist.py
          python3 voltage20/patch-voltageshift.py
          python3 voltage20/test-patches.py
          grep -q 'PL1_20W_LOCKED' vs/VoltageShiftAnVMSR/main.mm
          grep -q 'PL1_20W_OK' vs/VoltageShiftAnVMSR/main.mm
          grep -q 'uint64_t target = (original & ~pl1Mask) | rawTarget' vs/VoltageShiftAnVMSR/main.mm

      - name: Compile x86_64 VoltageShiftSecure Kext
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project vs/VoltageShift.xcodeproj \
            -configuration Release -target VoltageShift -sdk macosx \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build-products" \
            -quiet
          test -s build-products/VoltageShift.kext/Contents/MacOS/VoltageShift
          file build-products/VoltageShift.kext/Contents/MacOS/VoltageShift

      - name: Compile x86_64 command line tool
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project vs/VoltageShift.xcodeproj \
            -configuration Release -target voltageshift -sdk macosx \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build-products" \
            -quiet
          test -s build-products/voltageshift
          file build-products/voltageshift
          strings build-products/voltageshift | grep -q 'PL1_20W_OK'

      - name: Validate and package single-reboot installer
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            build-products/VoltageShift.kext/Contents/Info.plist | grep -Fx VoltageShift
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            build-products/VoltageShift.kext/Contents/Info.plist
          plutil -lint voltage20/com.matebook.pl1-20.plist
          bash -n voltage20/install-20w.sh
          bash -n voltage20/auto-20w.sh
          bash -n voltage20/uninstall-20w.sh
          mkdir -p output/MateBook-PL1-20W
          ditto build-products/VoltageShift.kext output/MateBook-PL1-20W/VoltageShift.kext
          cp build-products/voltageshift output/MateBook-PL1-20W/voltageshift
          cp voltage20/{install-20w.sh,auto-20w.sh,uninstall-20w.sh,com.matebook.pl1-20.plist,README.md} output/MateBook-PL1-20W/
          chmod 755 output/MateBook-PL1-20W/{voltageshift,install-20w.sh,auto-20w.sh,uninstall-20w.sh}
          git -C vs rev-parse HEAD > output/MateBook-PL1-20W/upstream-commit.txt
          cd output
          ditto -c -k --keepParent MateBook-PL1-20W MateBook-PL1-20W-Install.zip
          shasum -a 256 MateBook-PL1-20W-Install.zip > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Upload full package and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: MateBook-VoltageShiftSecure-PL1-20W
          path: |
            output/MateBook-PL1-20W-Install.zip
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
